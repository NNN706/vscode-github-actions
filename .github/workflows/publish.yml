name: Release VSIX and publish to Marketplace

on:
  push:
    tags:
      - 'v*'
      - 'release-v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the built VSIX to Visual Studio Marketplace
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-vsix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    outputs:
      file: ${{ steps.version.outputs.file }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve version and validate tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "v$VERSION" && "$TAG" != "release-v$VERSION" ]]; then
              echo "Tag does not match package.json version $VERSION" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=github-actions-multi-repo-$VERSION.vsix" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - name: Build and package VSIX
        env:
          VSIX_FILE: ${{ steps.version.outputs.file }}
        run: npx vsce package --no-dependencies --out "$VSIX_FILE"
      - name: Check package and create checksum
        env:
          VSIX_FILE: ${{ steps.version.outputs.file }}
        run: |
          unzip -t "$VSIX_FILE"
          sha256sum "$VSIX_FILE" > "$VSIX_FILE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file }}
          path: |
            *.vsix
            *.vsix.sha256
          if-no-files-found: error
      - name: Create release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VSIX_FILE: ${{ steps.version.outputs.file }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$VSIX_FILE" "$VSIX_FILE.sha256" --clobber
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

  marketplace:
    name: Publish to Visual Studio Marketplace
    needs: release
    if: github.event_name == 'push' || inputs.publish_marketplace
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
    concurrency:
      group: marketplace-publish
      cancel-in-progress: false
    steps:
      - name: Check publishing credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Add the VSCE_PAT GitHub Actions secret (Azure DevOps PAT with Marketplace: Manage). See MARKETPLACE.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release.outputs.file }}
          path: marketplace-artifact
      - name: Verify release package checksum
        working-directory: marketplace-artifact
        env:
          VSIX_FILE: ${{ needs.release.outputs.file }}
        run: sha256sum --check "$VSIX_FILE.sha256"
      - name: Publish the release VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_FILE: ${{ needs.release.outputs.file }}
        run: npx --no-install vsce publish --packagePath "marketplace-artifact/$VSIX_FILE" --skip-duplicate
      - name: Add Marketplace link to run summary
        run: |
          node -e 'const p = require("./package.json"); console.log(`Marketplace: https://marketplace.visualstudio.com/items?itemName=${p.publisher}.${p.name}`)' >> "$GITHUB_STEP_SUMMARY"
