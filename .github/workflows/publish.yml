name: Release VSIX

on:
  push:
    tags:
      - 'v*'
      - 'release-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-vsix-workflow-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve version and validate tag
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
            if [[ "$TAG" != "v$VERSION" && "$TAG" != "release-v$VERSION" ]]; then
              echo "Tag does not match package.json version $VERSION" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=github-actions-multi-repo-$VERSION.vsix" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - name: Build and package VSIX
        env:
          VSIX_FILE: ${{ steps.version.outputs.file }}
        run: npx vsce package --no-dependencies --out "$VSIX_FILE"
      - name: Check package and create checksum
        env:
          VSIX_FILE: ${{ steps.version.outputs.file }}
        run: |
          unzip -t "$VSIX_FILE"
          sha256sum "$VSIX_FILE" > "$VSIX_FILE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file }}
          path: |
            *.vsix
            *.vsix.sha256
          if-no-files-found: error
      - name: Create release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VSIX_FILE: ${{ steps.version.outputs.file }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$VSIX_FILE" "$VSIX_FILE.sha256" --clobber
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"

      - name: Check deploy credentials
        env:
          WORKFLOW_REPO_TOKEN: ${{ secrets.WORKFLOW_REPO_TOKEN }}
        run: |
          if [ -z "$WORKFLOW_REPO_TOKEN" ]; then
            echo "::error::Add WORKFLOW_REPO_TOKEN with Contents: Read and write for NNN706/workspace."
            exit 1
          fi
      - name: Checkout private workflow repository
        uses: actions/checkout@v4
        with:
          repository: NNN706/workspace
          token: ${{ secrets.WORKFLOW_REPO_TOKEN }}
          path: workflow-target
          persist-credentials: false
      - name: Deploy VSIX to workflow repository
        env:
          VSIX_FILE: ${{ steps.version.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
          WORKFLOW_REPO_TOKEN: ${{ secrets.WORKFLOW_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$VSIX_FILE"
          TARGET_DIR="workflow-target/.vscode/vsix"
          # Refuse symlinks so deployment cannot touch paths outside this directory.
          test ! -L workflow-target/.vscode
          test ! -L "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          # GitHub concurrency does not guarantee ordering of queued versions.
          NEWER_PRESENT=$(node - "$VERSION" "$TARGET_DIR" <<'NODE'
          const fs = require('fs');
          const semver = require('semver');
          const [version, directory] = process.argv.slice(2);
          if (!semver.valid(version)) throw new Error('Invalid release version');
          const newer = fs.readdirSync(directory).some(name => {
            const match = /^github-actions-multi-repo-(.+)\.vsix$/.exec(name);
            return match && semver.valid(match[1]) && semver.gt(match[1], version);
          });
          console.log(newer);
          NODE
          )
          if [ "$NEWER_PRESENT" = true ]; then
            echo "A newer GitHub Actions VSIX is already deployed; skipping $VERSION."
            exit 0
          fi
          find "$TARGET_DIR" -maxdepth 1 \( -type f -o -type l \) -name 'github-actions-multi-repo-*.vsix' -delete
          cp -- "$VSIX_FILE" "$TARGET_DIR/"
          cd workflow-target
          git add --all --force -- .vscode/vsix/
          if git diff --cached --quiet; then
            echo "VSIX is unchanged; no commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update GitHub Actions VSIX to $VERSION"
          # Read the PAT from the environment, never from a URL or a saved credential.
          git -c credential.helper= \
            -c 'credential.helper=!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$WORKFLOW_REPO_TOKEN"; fi; }; f' \
            push origin HEAD
